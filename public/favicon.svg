<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c30" />
      <stop offset="1" stop-color="#070911" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#c8ff4d" stop-opacity=".18" />
      <stop offset="1" stop-color="#c8ff4d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
