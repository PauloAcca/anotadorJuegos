    <circle cx="120" cy="462" r="4" fill="#6ee7ff" />
  </g>
  <g transform="rotate(-10 256 256)" filter="url(#shadow)">
    <rect x="128" y="128" width="256" height="256" rx="68" fill="url(#die)" />
    <g fill="#0a0d15">
