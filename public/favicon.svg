  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />
  <g opacity=".5">
    <circle cx="92" cy="128" r="5" fill="#6ee7ff" />
    <circle cx="418" cy="104" r="4" fill="#c4b5fd" />
    <circle cx="430" cy="390" r="5" fill="#ffab8f" />
    <circle cx="74" cy="372" r="3.5" fill="#ffe08a" />
